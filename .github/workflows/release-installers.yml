# Builds double-clickable installers and attaches them to a GitHub Release.
#
# Usage:
#   git tag v1.2.3 && git push origin v1.2.3
# then collect the .dmg / .exe from the Releases page.
#
# Two deliberate choices, both from watching the first attempt fail:
#
# 1. The build runs as a plain `npm run tauri build` and the upload is
#    softprops/action-gh-release, rather than tauri-apps/tauri-action. The
#    action failed instantly on both platforms with no usable signal, and its
#    logs need authentication to read. Explicit steps fail where the failure is
#    legible. This is also what the upstream desktop workflow in this repo does.
#
# 2. Both Mac targets build on macos-14. The macos-13 (Intel) runner sat queued
#    for 23 hours without ever being assigned, so an Intel job pinned to that
#    label produces nothing at all. Apple Silicon runners can cross-compile the
#    Intel slice, which actually ships.

name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the installers under (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    # One platform failing must not deny you the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            bundles: app,dmg
            artifacts: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS (Intel)
            bundles: app,dmg
            artifacts: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
            bundles: nsis,msi
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The Rust build is the slow half — llama.cpp and whisper.cpp compile from
      # C++ source. Caching turns a ~40 minute rebuild into a few minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Both runner images normally ship CMake; install only if that changes.
      - name: Ensure CMake
        shell: bash
        run: cmake --version || (${{ startsWith(matrix.platform, 'macos') && 'brew install cmake' || 'choco install cmake --installargs ADD_CMAKE_TO_PATH=System' }})

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        shell: bash
        # Ad-hoc signature on macOS. Not an Apple Developer identity, so the
        # download still carries a quarantine flag — the release notes say how
        # to clear it. Without even the ad-hoc signature, Apple Silicon refuses
        # to launch the binary at all.
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: List what was produced
        shell: bash
        run: find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: LettuceAI ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ matrix.artifacts }}
          body: |
            ## Download

            | Your computer | File to download |
            |---|---|
            | **MacBook / iMac** (2020 or newer) | `..._aarch64.dmg` |
            | **Mac** (older, Intel) | `..._x64.dmg` |
            | **Windows** | `..._x64-setup.exe` |

            ---

            ### Windows

            Double-click the `.exe`. Windows will say the publisher is unknown —
            click **More info**, then **Run anyway**. That warning appears
            because the app isn't signed with a paid certificate, not because
            anything is wrong with it.

            ### Mac

            Open the `.dmg` and drag **lettuceai** to Applications.

            The first time you open it, macOS will claim the app is "damaged".
            It isn't — that's the warning every app gets when it hasn't been
            through Apple's paid notarization. To get past it:

            1. Open **Applications**, right-click **lettuceai**, choose **Open**
            2. Click **Open** again in the dialog

            If macOS still refuses, go to **System Settings → Privacy &
            Security**, scroll down, and click **Open Anyway** next to the
            message about lettuceai.

            You only do this once. After that it opens normally from the Dock or
            Launchpad.
